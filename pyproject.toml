[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "garmin-ai-cycling-analyzer"
version = "0.1.0"
description = "Lokalna analiza kolesarskih aktivnosti Garmin FIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.71,<1",
  "garmin-fit-sdk>=21.218,<22",
  "plotly>=6.3,<7",
  "python-dotenv>=1.1,<2",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[project.scripts]
cycling-analyzer = "cycling_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cycling_analyzer"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

